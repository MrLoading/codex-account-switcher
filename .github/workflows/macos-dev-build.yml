# Rolling development release for this fork's main branch.
name: Development Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: development-release
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show selected Swift toolchain
        run: |
          xcode-select -p
          xcrun --find swift
          swift --version
          uname -m

      - name: Install fish for tests
        run: brew install fish

      - name: Run Swift tests
        run: ./scripts/run-tests.sh

      - name: Package ad-hoc signed macOS app
        id: package
        run: |
          set -euo pipefail

          app_path=$(./scripts/package-local-app.sh | tail -n 1)
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"

          codesign --verify --deep --strict "$app_path"

          archive="$RUNNER_TEMP/Codex-Account-Switcher-dev.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "$archive"

          (
            cd "$(dirname "$archive")"
            shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256"
          )

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Account-Switcher-macos-dev
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: Codex-Account-Switcher-*
          path: dist
          merge-multiple: true

      - name: Verify rolling release assets
        run: |
          set -euo pipefail
          test -s dist/Codex-Account-Switcher-dev.app.zip
          test -s dist/Codex-Account-Switcher-dev.app.zip.sha256
          test -s dist/Codex-Account-Switcher-windows-x64.exe
          test -s dist/Codex-Account-Switcher-windows-x64.exe.sha256
          (
            cd dist
            sha256sum -c Codex-Account-Switcher-dev.app.zip.sha256
            sha256sum -c Codex-Account-Switcher-windows-x64.exe.sha256
          )

      - name: Publish rolling development release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: dev-build
        run: |
          set -euo pipefail
          notes="Rolling development build from commit [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA). macOS is ad-hoc signed and Windows is unsigned."

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Development Build" \
              --notes "$notes" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Development Build" \
              --notes "$notes" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" \
            dist/Codex-Account-Switcher-dev.app.zip \
            dist/Codex-Account-Switcher-dev.app.zip.sha256 \
            dist/Codex-Account-Switcher-windows-x64.exe \
            dist/Codex-Account-Switcher-windows-x64.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
